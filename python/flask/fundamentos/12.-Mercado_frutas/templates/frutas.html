<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Mercado de Frutas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">
            <i class="bi bi-apple"></i> Mercado de Frutas
        </a>
        <div>
            <a class="nav-link text-white d-inline" href="{{ url_for('index') }}">Inicio</a>
            <a class="nav-link text-white d-inline" href="{{ url_for('catalogo') }}">Catálogo</a>
        </div>
    </div>
</nav>

<div class="container my-5">
    <h2 class="text-center mb-4">Catálogo de Productos</h2>
    <div class="row">
        {% for fruta in frutas %}
        <div class="col-md-3 mb-4">
            <div class="card h-100 shadow-sm text-center">
                <img src="{{ url_for('static', filename='img/' + fruta.imagen) }}" class="card-img-top" alt="{{ fruta.nombre }}">
                <div class="card-body">
                    <h5 class="card-title">{{ fruta.nombre }}</h5>
                    <p class="card-text text-muted">{{ fruta.descripcion }}</p>
                    <p class="text-success fw-bold fs-5">${{ fruta.precio }}</p>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

</body>
</html>
