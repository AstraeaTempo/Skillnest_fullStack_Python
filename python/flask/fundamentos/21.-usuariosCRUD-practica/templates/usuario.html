<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="container py-5">
    <div class="detail-card">
        <h1>Usuario {{ usuario.id }}</h1>
        <div class="user-detail">
            <p><strong>Nombre Completo:</strong> {{ usuario.nombre }} {{ usuario.apellido }}</p>
            <p><strong>E-mail:</strong> {{ usuario.email }}</p>
            <p><strong>Fecha Creación:</strong> {{ usuario.created_at }}</p>
            <p><strong>Fecha Actualización:</strong> {{ usuario.updated_at }}</p>
        </div>
        <div class="mt-4 d-flex gap-2">
            <a href="{{ url_for('editar_usuario', id=usuario.id) }}" class="btn btn-warning">Editar</a>
            <a href="{{ url_for('borrar_usuario', id=usuario.id) }}" class="btn btn-danger">Borrar</a>
            <a href="{{ url_for('usuarios') }}" class="btn btn-outline-secondary">Volver</a>
        </div>
    </div>
</div>
</body>
</html>
