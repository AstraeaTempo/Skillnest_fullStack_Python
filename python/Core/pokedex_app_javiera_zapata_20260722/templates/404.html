<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <link rel="stylesheet" href="../static/css/style404.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Geomini:wght@200..800&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <main>
        <div class="container">
            <div class="titulo">
                <h1>¡Oh no!</h1>
            </div>
            <div class="not">
                <p>No pudimos encontrar información sobre "agumon" en nuestra pokédex.</p>
            </div>
            <div class="alert">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <h4>Pókemon no encontrado</h4>
            </div>
            <div class="text">
                <h6>Tal vez este pókemon aún no ha sido descubierto, o quizás has escrito mal su nombre</h6>
            </div>
            <div class="inicio-pokedex">
                <button><i class="bi bi-house-door-fill">Volver a la Pókedex</i></button>
            </div>
        </div>
    </main>
</body>

</html>
