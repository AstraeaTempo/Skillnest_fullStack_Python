<!-- Inicio -->
<!DOCTYPE html>
<!-- Idioma -->
<html lang="es">
    <!-- Cabeza -->
<head>
    <meta charset="UTF-8">
    <!-- titulo -->
    <title>Nueva Peli</title>
    <!-- bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- css -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<!-- fin cabeza -->
<!-- cuerpo -->
<body>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Nueva Película</h1>
            <div class="nav-links">
                <a href="/cine">Inicio</a>
                <a href="/logout">Cerrar Sesión</a>
            </div>
        </div>

        {% with messages = get_flashed_messages(category_filter=['pelicula']) %}
        {% if messages %}
        {% for msg in messages %}
        <div class="error-msg">{{ msg }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form action="/cine/crear" method="POST" class="col-md-6">
            <div class="mb-3 row">
                <label class="col-sm-4 col-form-label">Nombre de Peli:</label>
                <div class="col-sm-8">
                    <input type="text" name="titulo" class="form-control"
                        value="{{ session.get('pelicula_form', {}).get('titulo', '') }}">
                </div>
            </div>
            <div class="mb-3 row">
                <label class="col-sm-4 col-form-label">Director:</label>
                <div class="col-sm-8">
                    <input type="text" name="director" class="form-control"
                        value="{{ session.get('pelicula_form', {}).get('director', '') }}">
                </div>
            </div>
            <div class="mb-3 row">
                <label class="col-sm-4 col-form-label">Fecha Estreno:</label>
                <div class="col-sm-8">
                    <input type="date" name="fecha_estreno" class="form-control"
                        value="{{ session.get('pelicula_form', {}).get('fecha_estreno', '') }}">
                </div>
            </div>
            <div class="mb-3 row">
                <label class="col-sm-4 col-form-label">Sinopsis:</label>
                <div class="col-sm-8">
                    <textarea name="sinopsis" class="form-control"
                        rows="4">{{ session.get('pelicula_form', {}).get('sinopsis', '') }}</textarea>
                </div>
            </div>
            <div class="text-end">
                <button type="submit" class="btn btn-outline-dark">Guardar Película</button>
            </div>
        </form>
    </div>
</body>
<!-- fin cuerpo -->
</html>
<!-- fin html -->
