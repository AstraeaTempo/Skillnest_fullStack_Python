<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar Entrada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="d-flex justify-content-end mb-4">
            <a href="/dashboard" class="me-3 text-decoration-underline">Inicio</a>
            <a href="/logout" class="text-decoration-underline text-danger">Cerrar Sesión</a>
        </div>

        <h4>Resultados de búsqueda para: "{{ termino }}"</h4>

        <div class="row row-cols-1 row-cols-md-2 g-4 mt-2">
            {% for entrada in entradas %}
            <div class="col">
                <div class="card p-3 wireframe-border">
                    <h5>Entrada</h5>
                    <p class="text-muted fw-bold">{{ entrada.fecha_entrada }}</p>
                    <p class="card-text text-truncate">{{ entrada.notas }}</p>
                    <div class="d-flex gap-2 mt-2">
                        <a href="/editar/{{ entrada.id }}" class="btn btn-sm btn-outline-dark">Editar</a>
                        <a href="/borrar/{{ entrada.id }}" class="btn btn-sm btn-outline-dark" onclick="return confirm('¿Seguro que deseas borrar esta entrada?')">Borrar</a>
                        <a href="/ver/{{ entrada.id }}" class="btn btn-sm btn-outline-dark">Ver</a>
                    </div>
                </div>
            </div>
            {% else %}
            <div class="col-12">
                <p class="text-muted">No se encontraron entradas que contengan el término ingresado.</p>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
