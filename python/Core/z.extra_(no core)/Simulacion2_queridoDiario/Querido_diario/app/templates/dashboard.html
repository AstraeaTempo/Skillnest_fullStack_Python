<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Querido Diario - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">
    <div class="container py-4">
        <!-- Encabezado y Navegación -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Bienvenid@, {{ usuario.nombre }}</h2>
            <div>
                <a href="/nueva" class="me-3 text-decoration-underline">Nuevo Entrada</a>
                <a href="/logout" class="text-decoration-underline text-danger">Cerrar Sesión</a>
            </div>
        </div>

        <!-- Barra de Búsqueda -->
        <form action="/buscar" method="GET" class="row g-2 mb-4">
            <div class="col-auto">
                <input type="text" name="q" class="form-control" placeholder="Término a Buscar" required>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-outline-dark">Buscar</button>
            </div>
        </form>

        <!-- Lista de Entradas -->
        <div class="row row-cols-1 row-cols-md-2 g-4">
            {% for entrada in entradas %}
            <div class="col">
                <div class="card p-3 wireframe-border">
                    <h5>Entrada</h5>
                    <p class="text-muted fw-bold">{{ entrada.fecha_entrada }}</p>
                    <div class="d-flex gap-2 mt-2">
                        <a href="/editar/{{ entrada.id }}" class="btn btn-sm btn-outline-dark">Editar</a>
                        <a href="/borrar/{{ entrada.id }}" class="btn btn-sm btn-outline-dark" onclick="return confirm('¿Seguro que deseas borrar esta entrada?')">Borrar</a>
                        <a href="/ver/{{ entrada.id }}" class="btn btn-sm btn-outline-dark">Ver</a>
                    </div>
                </div>
            </div>
            {% else %}
            <div class="col-12">
                <p class="text-muted">No tienes entradas en tu diario aún.</p>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
