<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Entrada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="d-flex justify-content-end mb-4">
            <a href="/dashboard" class="me-3 text-decoration-underline">Inicio</a>
            <a href="/logout" class="text-decoration-underline text-danger">Cerrar Sesión</a>
        </div>

        <div class="card p-4 wireframe-border mx-auto" style="max-width: 600px;">
            <h3>Editar Entrada</h3>

            {% with messages = get_flashed_messages(category_filter=['entrada']) %}
                {% if messages %}
                    <div class="alert alert-danger p-2 my-2">
                        {% for message in messages %}
                            <div><small>{{ message }}</small></div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form action="/editar/actualizar/{{ entrada.id }}" method="POST">
                <div class="mb-3">
                    <label class="form-label">Fecha Entrada:</label>
                    <input type="date" name="fecha_entrada" value="{{ entrada.fecha_entrada }}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Notas:</label>
                    <textarea name="notas" class="form-control" rows="5" required>{{ entrada.notas }}</textarea>
                </div>
                <button type="submit" class="btn btn-outline-dark">Guardar</button>
            </form>
        </div>
    </div>
</body>
</html>
