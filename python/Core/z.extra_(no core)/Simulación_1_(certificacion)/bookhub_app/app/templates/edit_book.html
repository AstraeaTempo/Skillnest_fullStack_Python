{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title mb-4">Editar Libro</h3>
                
                {% with messages = get_flashed_messages(category_filter=["book_error"]) %}
                    {% if messages %}
                        <div class="alert alert-danger">
                            <ul class="mb-0">
                            {% for message in messages %}
                                <li>{{ message }}</li>
                            {% endfor %}
                            </ul>
                        </div>
                    {% endif %}
                {% endwith %}

                <form action="/libros/actualizar/{{ book.id }}" method="POST">
                    <div class="mb-3 row">
                        <label class="col-sm-3 col-form-label">Título:</label>
                        <div class="col-sm-9">
                            <input type="text" name="title" class="form-control" value="{{ book.title }}" required>
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <label class="col-sm-3 col-form-label">Autor:</label>
                        <div class="col-sm-9">
                            <input type="text" name="author" class="form-control" value="{{ book.author }}" required>
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <label class="col-sm-3 col-form-label">Género:</label>
                        <div class="col-sm-9">
                            <select name="genre" class="form-select" required>
                                <option value="Novela" {% if book.genre == 'Novela' %}selected{% endif %}>Novela</option>
                                <option value="Fábula" {% if book.genre == 'Fábula' %}selected{% endif %}>Fábula</option>
                                <option value="Ciencia Ficción" {% if book.genre == 'Ciencia Ficción' %}selected{% endif %}>Ciencia Ficción</option>
                                <option value="Romance" {% if book.genre == 'Romance' %}selected{% endif %}>Romance</option>
                                <option value="Desarrollo Personal" {% if book.genre == 'Desarrollo Personal' %}selected{% endif %}>Desarrollo Personal</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <label class="col-sm-3 col-form-label">Fecha de publicación:</label>
                        <div class="col-sm-9">
                            <input type="date" name="release_date" class="form-control" value="{{ book.release_date.strftime('%Y-%m-%d') if book.release_date else '' }}" required>
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <label class="col-sm-3 col-form-label">Descripción:</label>
                        <div class="col-sm-9">
                            <textarea name="description" class="form-control" rows="4" required>{{ book.description }}</textarea>
                        </div>
                    </div>
                    <div class="d-flex justify-content-start gap-2">
                        <button type="submit" class="btn btn-dark">Actualizar</button>
                        <a href="/libros" class="btn btn-link text-decoration-none">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
